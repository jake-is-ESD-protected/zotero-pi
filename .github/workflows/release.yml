name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Do not cancel a publication halfway through when another tag is pushed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate annotated tag and main ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.20.0"
      - name: Check version, changelog, tag type, and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs verify-tag "$RELEASE_TAG"
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    name: Publish GitHub release (not npm)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.20.0"
      - name: Publish validated source package and changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release.mjs verify-tag "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving its notes and assets."
            exit 0
          fi
          npm run check:package
          node scripts/release.mjs notes "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          npm pack --ignore-scripts
          version="$(node -p 'require("./package.json").version')"
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "zotero-pi-$version.tgz" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "zotero-pi $version" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${flags[@]}"
